[project]
name = "time-series-with-pytorch"
version = "0.1.0"
description = "Time Series with PyTorch book notebooks and code"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
	"loguru>=0.7.2,<0.8.0",
]

[dependency-groups]
darts = ["darts>=0.26.0,<0.27.0"]
notebook = [
	"ipykernel>=6.21.1,<7.0.0",
	"jupytext>=1.15.2,<2.0.0",
]
visualization = [
	"seaborn>=0.13.2,<0.14.0",
	"opentsne>=1.0.2,<2.0.0",
	"plotly>=6.1.1,<7.0.0",
]
data = [
	"ts-bolt==0.0.7",
]
torch = [
	"lightning>=2.1.2,<3.0.0",
	"tensorboard>=2.15.1,<3.0.0",
	"torchmetrics>=1.2.0,<2.0.0",
	"torchdyn>=1.0.6,<2.0.0",
	"torch-tb-profiler>=0.4.3,<0.5.0",
	"torch>=2.5.1,<3.0.0",
	"torchdr>=0.3,<0.4",
]
nixtla = [
	"neuralforecast>=1.7.4,<2.0.0",
	"mlforecast>=0.13.4,<0.14.0",
	"statsforecast>=1.7.6,<2.0.0",
	"datasetsforecast>=0.0.8,<0.0.9",
]

[tool.setuptools.packages.find]
include = ["ts_dl_utils*"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"
